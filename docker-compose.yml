version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphahunter-ai
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    command: ["python", "-m", "app"]
    networks:
      - alphahunter-network

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: alphahunter-ai-dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - alphahunter-network

networks:
  alphahunter-network:
    driver: bridge
